name: Refresh Dependencies

on:
  push:
    branches:
      - chore/quality-ci

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/quality-ci

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update secure dependencies
        run: |
          npm install --save-exact next@16.3.5 firebase-admin@14.4.0
          npm install --save-dev --save-exact eslint-config-next@16.3.5

      - name: Commit lockfile refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update secure dependencies"
          git push origin HEAD:chore/quality-ci
